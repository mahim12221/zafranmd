<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="facet1" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="facet2" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="facet3" x1="30" y1="30" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container Backdrop with subtle border -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="116" height="116" rx="30" stroke="url(#glowRing)" stroke-width="2.5" />

  <!-- Epic Abstract Geometric Dimensional Mark -->
  <!-- Top Prism Face -->
  <path d="M64 24 L98 44 L64 64 L30 44 Z" fill="url(#facet3)" opacity="0.95" />
  <!-- Bottom Right Prism Face -->
  <path d="M64 64 L98 44 L98 84 L64 104 Z" fill="url(#facet1)" />
  <!-- Bottom Left Prism Face -->
  <path d="M64 64 L30 44 L30 84 L64 104 Z" fill="url(#facet2)" />
  
  <!-- Central Dynamic Vector Beam / Epic Casual Slash -->
  <path d="M42 37 L86 91" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.95" filter="url(#glow)" />
  <circle cx="86" cy="41" r="5.5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="42" cy="87" r="4.5" fill="#fed7aa" />
</svg>
